services:
  postgres:
    image: postgres:17
    container_name: aei-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
                              
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5    

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aei-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage
    
  ollama:
    image: ollama/ollama:latest
    container_name: aei-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"
    
    volumes:
      - ollama_data:/root/.ollama  

volumes:
  postgres_data:
  qdrant_data:
  ollama_data: